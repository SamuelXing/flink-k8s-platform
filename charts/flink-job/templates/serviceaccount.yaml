{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "flink-job.serviceAccountName" . }}
  labels:
    {{- include "flink-job.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
# The JobManager needs to create and watch TaskManager pods, and native
# Kubernetes HA keeps leader election in a ConfigMap. Both need RBAC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "flink-job.serviceAccountName" . }}
  labels:
    {{- include "flink-job.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "flink-job.serviceAccountName" . }}
  labels:
    {{- include "flink-job.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "flink-job.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "flink-job.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
