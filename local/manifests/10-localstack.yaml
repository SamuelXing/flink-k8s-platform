# LocalStack, S3 only. It lets the Flink config say s3:// locally as it does in
# EKS, and it is the same emulator `make tf-local-apply` runs the checkpoints
# Terraform module against.
#
# Any S3-compatible store would serve the runtime side equally well: the four
# s3.* lines in values-local.yaml would be identical. LocalStack is here
# because MinIO's community images are no longer published, and because one
# emulator for both the runtime and the Terraform check is one less thing.
#
# It is NOT used for EKS, MSK or VPC. Those are mocked API responses: an apply
# goes green without proving anything would come up on real AWS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: flink-platform
spec:
  replicas: 1
  selector:
    matchLabels: { app: localstack }
  template:
    metadata:
      labels: { app: localstack }
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "s3"
            - name: DEBUG
              value: "0"
            - name: PERSISTENCE
              value: "0"
          readinessProbe:
            httpGet: { path: /_localstack/health, port: 4566 }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { memory: 384Mi, cpu: 100m }
            limits:   { memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: flink-platform
spec:
  selector: { app: localstack }
  ports:
    - name: edge
      port: 4566
      targetPort: 4566
---
# Creates the checkpoint bucket. In prod this is the terraform `checkpoints`
# module instead, which is the one module that can also be applied here.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-checkpoint-bucket
  namespace: flink-platform
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: awscli
          image: amazon/aws-cli:2.17.0
          env:
            - name: AWS_ACCESS_KEY_ID
              value: test
            - name: AWS_SECRET_ACCESS_KEY
              value: test
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              until aws --endpoint-url http://localstack:4566 s3 ls >/dev/null 2>&1; do
                echo "waiting for localstack..."; sleep 3
              done
              aws --endpoint-url http://localstack:4566 s3 mb s3://flink-checkpoints || true
              aws --endpoint-url http://localstack:4566 s3 ls
