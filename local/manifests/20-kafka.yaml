# Strimzi, KRaft. This file is a template: the Tiltfile fills in __BROKERS__,
# __RF__ and __MIN_ISR__ from KAFKA_BROKERS (default 1, so the stack fits in
# 8 GB; `KAFKA_BROKERS=3 tilt up` for a real replicated cluster).
#
# Note which Kubernetes object a broker is: Strimzi gives every broker a stable
# identity and its own volume, because broker 2's log segments ARE broker 2's.
# A Flink TaskManager owns nothing: the JobManager reassigns key groups on
# every restore, so TaskManagers are interchangeable pods.
apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: flink-platform
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: __BROKERS__
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests:
      memory: 768Mi
      cpu: 250m
    limits:
      memory: 1Gi
  jvmOptions:
    "-Xms": 512m
    "-Xmx": 512m
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: kafka
  namespace: flink-platform
spec:
  kafka:
    version: 4.3.2
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: __RF__
      transaction.state.log.replication.factor: __RF__
      transaction.state.log.min.isr: __MIN_ISR__
      default.replication.factor: __RF__
      min.insync.replicas: __MIN_ISR__
      # Topics are declared below, never created by a typo in a job.
      auto.create.topics.enable: false
  entityOperator:
    topicOperator: {}
---
# metadata.name cannot contain an underscore; spec.topicName is the real name,
# and it has to match kafka.topics.* in the chart values exactly.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: orders
  namespace: flink-platform
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: orders
  # The ceiling on the pipeline's source parallelism.
  partitions: 6
  replicas: __RF__
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: revenue-1m
  namespace: flink-platform
  labels:
    strimzi.io/cluster: kafka
spec:
  topicName: revenue_1m
  partitions: 3
  replicas: __RF__
