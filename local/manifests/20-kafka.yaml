# Strimzi, in KRaft mode. Three brokers so partitions are genuinely spread and
# the "parallelism cannot exceed partition count" ceiling is real locally.
#
# Note which Kubernetes object a broker is: Strimzi runs brokers as a
# StatefulSet, because broker 3's log segments ARE broker 3's. Flink
# TaskManagers are not: the JobManager reassigns key groups on every restore,
# so a TaskManager owns nothing and a Deployment is correct for it.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: flink-platform
  labels:
    strimzi.io/cluster: kafka
spec:
  replicas: 3
  roles:
    - controller
    - broker
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: true
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: kafka
  namespace: flink-platform
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.8.0
    metadataVersion: 3.8-IV0
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
  entityOperator:
    topicOperator: {}
    userOperator: {}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: orders
  namespace: flink-platform
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 6
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: revenue-1m
  namespace: flink-platform
  labels:
    strimzi.io/cluster: kafka
spec:
  partitions: 3
  replicas: 3
