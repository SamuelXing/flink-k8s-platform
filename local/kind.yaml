# A three-node cluster, so "which node did that TaskManager land on" is a real
# question locally too. One node would hide every scheduling problem.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: flink-platform
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
  - role: worker
  - role: worker
